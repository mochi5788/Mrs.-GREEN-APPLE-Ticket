<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mrs. GREEN APPLE チケット・イベント申込ナビ</title>
    <style>
        :root {
            --primary-gold: #e6ca65;
            --secondary-gold: #b38f38;
            --bg-dark-green: #042e14;
            --bg-deep-green: #004d1a;
            --card-bg: rgba(4, 46, 20, 0.75);
            --card-border: rgba(230, 202, 101, 0.3);
            --text-color: #f4f6f0;
            --accent-red: #d93838;
        }

        body {
            font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'ヒラギノ明朝 ProN', 'Georgia', serif;
            background: radial-gradient(circle at center, var(--bg-deep-green) 0%, var(--bg-dark-green) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px 40px;
            color: var(--text-color);
            box-sizing: border-box;
            position: relative;
        }

        /* 和紙の質感 overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 8px 8px;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 28px 22px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(230, 202, 101, 0.08);
            border: 1px solid var(--card-border);
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            background: linear-gradient(45deg, #fceabb, #e6ca65, #fceabb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .subtitle {
            text-align: center;
            font-size: 0.82rem;
            color: #b3c7b8;
            margin-bottom: 22px;
            letter-spacing: 0.05em;
        }

        /* 進捗バー */
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            border-radius: 2px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, var(--secondary-gold), var(--primary-gold));
            transition: width 0.4s ease;
        }

        /* 戻るボタン */
        .back-btn-wrapper {
            margin-bottom: 15px;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--primary-gold);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .back-btn:hover {
            background: rgba(230, 202, 101, 0.15);
            text-decoration: underline;
        }

        /* 画面アニメーション */
        .step {
            display: none;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .step.active {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        .question {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: #ffffff;
            line-height: 1.5;
            letter-spacing: 0.03em;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(230, 202, 101, 0.3);
            color: #ffffff;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
            text-align: left;
            position: relative;
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(230, 202, 101, 0.15);
            border-color: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(230, 202, 101, 0.2);
        }

        .btn-tag {
            display: inline-block;
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: normal;
        }
        .tag-live { background: rgba(230, 202, 101, 0.2); color: #fceabb; }
        .tag-cafe { background: rgba(217, 56, 56, 0.25); color: #ff9e9e; }

        /* 結果カード */
        .result-card {
            background: rgba(255, 255, 255, 0.04);
            border-left: 4px solid var(--primary-gold);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .result-card h3 {
            margin-top: 0;
            color: var(--primary-gold);
            font-size: 1.1rem;
        }

        .advice-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(230, 202, 101, 0.2);
            padding: 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #d1e0d5;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        /* 公式URLボタン */
        .official-link-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(135deg, #b38f38 0%, #e6ca65 50%, #b38f38 100%);
            color: #042e14;
            font-weight: 800;
            font-size: 0.98rem;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(230, 202, 101, 0.3);
            transition: all 0.3s ease;
        }

        .official-link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 202, 101, 0.5);
            filter: brightness(1.1);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            text-align: center;
            margin-top: 15px;
        }

        /* フッター注記 */
        .disclaimer-footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(230, 202, 101, 0.15);
            text-align: center;
            font-size: 0.78rem;
            color: #a3b8aa;
            line-height: 1.5;
        }

        .disclaimer-footer a {
            color: var(--primary-gold);
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .disclaimer-footer a:hover {
            color: #ffffff;
        }

        ul {
            padding-left: 20px;
            line-height: 1.7;
            font-size: 0.92rem;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mrs. GREEN APPLE</h1>
    <div class="subtitle">イベント・チケット申込条件 判定ガイド</div>

    <!-- 進捗バー -->
    <div class="progress-container">
        <div id="progress" class="progress-bar"></div>
    </div>

    <!-- イベント選択 -->
    <div id="step-event" class="step active">
        <div class="question">参加・予約したいイベントを選択してください</div>
        <button class="btn" onclick="selectEvent('shadows')">
            Ringo jam Tour SHADOWS<span class="btn-tag tag-live">FC限定ライブ</span>
        </button>
        <button class="btn" onclick="selectEvent('harmony2')">
            Mrs. GREEN APPLE on “Harmony 2”<span class="btn-tag tag-live">【最速先行受付中】K-Arena</span>
        </button>
        <button class="btn" onclick="selectEvent('cafe')">
            Ringo Jam Cafe<span class="btn-tag tag-cafe">【一般抽選受付中】コラボカフェ</span>
        </button>
    </div>

    <!-- 申込者のFC状況 -->
    <div id="step-fc" class="step">
        <div class="back-btn-wrapper"><button class="back-btn" onclick="goBack()">← 前に戻る</button></div>
        <div class="question">あなた（申込者）の Ringo Jam 会員状況を選択してください</div>
        <button class="btn" onclick="nextStep('fc', 'annual')">年会員（Ringo Jam 年額コース）</button>
        <button class="btn" onclick="nextStep('fc', 'monthly')">月会員（Ringo Jam 月額コース）</button>
        <button class="btn" onclick="nextStep('fc', 'none')">非会員（入会していない）</button>
    </div>

    <!-- 人数選択（動的生成） -->
    <div id="step-people" class="step">
        <div class="back-btn-wrapper"><button class="back-btn" onclick="goBack()">← 前に戻る</button></div>
        <div class="question" id="people-title">何名で申し込みますか？</div>
        <div id="people-options"></div>
    </div>

    <!-- 同行者のFC状況（ライブ用） -->
    <div id="step-guest-fc" class="step">
        <div class="back-btn-wrapper"><button class="back-btn" onclick="goBack()">← 前に戻る</button></div>
        <div class="question">同行者の Ringo Jam 会員状況を選択してください</div>
        <button class="btn" onclick="nextStep('guest_fc', 'guest_annual')">同行者も「年会員」</button>
        <button class="btn" onclick="nextStep('guest_fc', 'guest_monthly')">同行者は「月会員」</button>
        <button class="btn" onclick="nextStep('guest_fc', 'guest_none')">同行者は「非会員」</button>
    </div>

    <!-- 席種 / 予約区分選択 -->
    <div id="step-detail" class="step">
        <div class="back-btn-wrapper"><button class="back-btn" onclick="goBack()">← 前に戻る</button></div>
        <div class="question" id="detail-title">希望の条件を選択してください</div>
        <div id="detail-options"></div>
    </div>

    <!-- 結果画面 -->
    <div id="step-result" class="step">
        <div class="back-btn-wrapper"><button class="back-btn" onclick="goBack()">← 前に戻る</button></div>

        <h2>診断・事前準備のご案内</h2>
        <div class="result-card">
            <h3 id="res-title"></h3>
            <p id="res-detail" style="line-height:1.6; font-size:0.95rem;"></p>
        </div>

        <div id="event-advice" class="advice-box"></div>

        <h4 style="color:var(--primary-gold); margin-bottom:8px;">必要なもの・チェックリスト</h4>
        <ul id="res-items"></ul>

        <!-- 公式特設ページリンク -->
        <a id="official-link" href="#" target="_blank" rel="noopener noreferrer" class="official-link-btn">
            公式特設サイトを見る（申込み・詳細） ↗
        </a>

        <button class="btn reset-btn" onclick="resetForm()">最初からやり直す</button>
    </div>

    <!-- 常時表示の非公式注記 -->
    <div class="disclaimer-footer">
        当サイトは個人のファンにより作成された非公式サイトです。<br>
        正確な情報は <a href="https://mrsgreenapple.com/" target="_blank" rel="noopener noreferrer">Mrs. GREEN APPLE 公式サイト</a> をご確認ください。
    </div>
</div>

<script>
    const eventMaster = {
        'shadows': {
            name: 'Ringo jam Tour SHADOWS',
            maxSeats: 2,
            needsFC: true,
            url: 'https://mrsgreenapple.com/feature/ringojamtour_shadows?_normalbrowse_=1'
        },
        'harmony2': {
            name: 'Mrs. GREEN APPLE on “Harmony 2”',
            maxSeats: 2,
            needsFC: true,
            url: 'https://mrsgreenapple.com/feature/harmony_2?_normalbrowse_=1'
        },
        'cafe': {
            name: 'Ringo Jam Cafe',
            maxSeats: 4,
            needsFC: false,
            url: 'https://ringojam-cafe.ltr-online.com/?_normalbrowse_=1'
        }
    };

    let answers = {};
    let historyStack = ['step-event'];

    function updateProgress(percent) {
        document.getElementById('progress').style.width = percent + '%';
    }

    function selectEvent(eventId) {
        answers.event = eventId;
        setupPeopleStep();
        updateProgress(40);
        navigateTo('step-fc');
    }

    function setupPeopleStep() {
        const title = document.getElementById('people-title');
        const container = document.getElementById('people-options');
        container.innerHTML = '';

        if (answers.event === 'cafe') {
            title.textContent = 'カフェのご予約人数を選択してください（最大4席）';
            container.innerHTML = `
                <button class="btn" onclick="nextStep('people', 1)">1名（自分のみ）</button>
                <button class="btn" onclick="nextStep('people', 2)">2名（ご自分＋同伴者1名）</button>
                <button class="btn" onclick="nextStep('people', 3)">3名（ご自分＋同伴者2名）</button>
                <button class="btn" onclick="nextStep('people', 4)">4名（ご自分＋同伴者3名）</button>
            `;
        } else {
            title.textContent = '申し込み人数を選択してください';
            container.innerHTML = `
                <button class="btn" onclick="nextStep('people', 1)">1名（自分のみ）</button>
                <button class="btn" onclick="nextStep('people', 2)">2名（同行者あり）</button>
            `;
        }
    }

    function nextStep(key, value) {
        answers[key] = value;

        if (key === 'fc') {
            if (answers.event === 'shadows' && value === 'none') {
                updateProgress(100);
                navigateTo('step-result');
            } else {
                updateProgress(60);
                navigateTo('step-people');
            }
        } else if (key === 'people') {
            const ev = eventMaster[answers.event];
            if (answers.event !== 'cafe' && value === 2 && ev.needsFC) {
                updateProgress(80);
                navigateTo('step-guest-fc');
            } else {
                setupDetailStep();
                updateProgress(80);
                navigateTo('step-detail');
            }
        } else if (key === 'guest_fc') {
            setupDetailStep();
            updateProgress(90);
            navigateTo('step-detail');
        } else if (key === 'detail') {
            updateProgress(100);
            navigateTo('step-result');
        }
    }

    function navigateTo(targetStepId) {
        historyStack.push(targetStepId);
        showStep(targetStepId, 'next');
    }

    function goBack() {
        if (historyStack.length > 1) {
            historyStack.pop();
            const prevStepId = historyStack[historyStack.length - 1];
            
            const progressMap = {
                'step-event': 20,
                'step-fc': 40,
                'step-people': 60,
                'step-guest-fc': 80,
                'step-detail': 80,
                'step-result': 100
            };
            updateProgress(progressMap[prevStepId] || 20);

            showStep(prevStepId, 'back');
        }
    }

    function setupDetailStep() {
        const title = document.getElementById('detail-title');
        const container = document.getElementById('detail-options');
        container.innerHTML = '';

        if (answers.event === 'cafe') {
            title.textContent = '希望のカフェ事前予約枠を選択してください';
            container.innerHTML = `
                <button class="btn" onclick="nextStep('detail', 'c_general_draw')">一般抽選予約枠（10/5〜10/8受付）</button>
                <button class="btn" onclick="nextStep('detail', 'c_cancel')">直前キャンセル枠 / 当日席</button>
            `;
        } else {
            title.textContent = '希望する席種を選択してください';
            container.innerHTML = `
                <button class="btn" onclick="nextStep('detail', 'ss')">Ringo Jam シート / SS指定席</button>
                <button class="btn" onclick="nextStep('detail', 'standard')">S指定席 / 一般枠</button>
                <button class="btn" onclick="nextStep('detail', 'family')">着席指定席 / バリアフリー席</button>
            `;
        }
    }

    function showStep(stepId, direction = 'next') {
        const current = document.querySelector('.step.active');
        const next = document.getElementById(stepId);

        if (stepId === 'step-result') {
            renderResultContent();
        }

        if (current) {
            current.style.opacity = '0';
            current.style.transform = direction === 'next' ? 'translateX(-20px)' : 'translateX(20px)';
            
            setTimeout(() => {
                current.classList.remove('active');
                next.classList.add('active');
                next.style.transform = direction === 'next' ? 'translateX(20px)' : 'translateX(-20px)';
                
                setTimeout(() => {
                    next.style.opacity = '1';
                    next.style.transform = 'translateX(0)';
                }, 50);
            }, 300);
        } else {
            next.classList.add('active');
            next.style.opacity = '1';
            next.style.transform = 'translateX(0)';
        }
    }

    function renderResultContent() {
        const titleEl = document.getElementById('res-title');
        const detailEl = document.getElementById('res-detail');
        const adviceEl = document.getElementById('event-advice');
        const itemsEl = document.getElementById('res-items');
        const linkEl = document.getElementById('official-link');

        itemsEl.innerHTML = '';

        const eventData = eventMaster[answers.event];
        linkEl.href = eventData.url;
        linkEl.textContent = `${eventData.name} 公式特設サイトを見る ↗`;

        // --- Ringo Jam Cafe の場合 ---
        if (answers.event === 'cafe') {
            const peopleNum = answers.people || 1;
            
            if (answers.detail === 'c_general_draw') {
                titleEl.textContent = `【Ringo Jam Cafe】一般抽選受付中（${peopleNum}名分）`;
                detailEl.textContent = 'FC会員・非会員問わずお申込みいただけます。受付期間は **10月5日(月)13:00 ～ 10月8日(木)23:59** です！';
            } else {
                titleEl.textContent = `【Ringo Jam Cafe】キャンセル枠 / 当日席のご案内`;
                detailEl.textContent = '事前予約サイトで前日15:00までキャンセル枠（先着）が出るほか、当日の空き状況に応じて「当日席」が用意されます。';
            }
            
            adviceEl.innerHTML = `
                <strong>【Ringo Jam Cafe 予約の最新ポイント】</strong><br>
                ・<strong>一般抽選販売受付中：</strong>10月5日(月) 13:00 ～ 10月8日(木) 23:59 まで抽選申し込みが可能です。<br>
                ・<strong>同伴者は非会員でもOK：</strong>1回の申し込みで最大4席まで予約できます。同伴者は非会員でも一緒に入場可能です。<br>
                ・<strong>予約代金：</strong>1名につき550円（税込） ※ご来店時のお会計金額から引き落とされます（実質予約特典代）。<br>
                ・<strong>事前予約特典：</strong>事前予約で来店すると「JAM'S Drawメッセージカード（全3種ランダム）」をプレゼント！
            `;

            const items = [
                '予約完了画面（電子チケット / マイページ画面）',
                '予約者本人の身分証明書（本人確認用）',
                '（同伴者はファンクラブ非会員も入場可）'
            ];
            items.forEach(item => itemsEl.innerHTML += `<li>${item}</li>`);
            return;
        }

        // --- LIVE（Ringo jam Tour SHADOWS）の場合 ---
        if (answers.event === 'shadows') {
            if (answers.fc === 'none') {
                titleEl.textContent = '【SHADOWS 申込不可】Ringo Jamへの入会が必須です';
                detailEl.textContent = '全席ファンクラブ限定公演です。非会員のままでは申込・同行どちらもできません。';
                adviceEl.innerHTML = '<strong>【対策】</strong>応募前にファンクラブ（月額または年額）へのご入会が必要です。';
            } else if (answers.people === 2 && answers.guest_fc === 'guest_none') {
                titleEl.textContent = '【SHADOWS 注意】同行者も Ringo Jam 入会が必要です';
                detailEl.textContent = '2枚申し込みの場合、同行者もFC会員である必要があります（カフェと異なりライブは同行者もFC限定です）。';
                adviceEl.innerHTML = '<strong>【対策】</strong>応募前に同行者もファンクラブへ入会し「Plus member ID」を取得してください。';
            } else {
                let priority = (answers.fc === 'annual') ? '「年会員最速先行」' : '「月会員先行」';
                titleEl.textContent = `【SHADOWS 申込可能】${priority}から応募してください`;
                detailEl.textContent = '条件を満たしています。公式アプリおよび特設サイトからお申込みください。';
                adviceEl.innerHTML = '<strong>【確認】</strong>当日は厳格な本人確認が行われます。顔写真付き身分証を必ず持参してください。';
            }
        } 
        // --- LIVE（Harmony 2）の場合 ---
        else if (answers.event === 'harmony2') {
            const isGuestOk = (answers.people === 1) || (answers.guest_fc === 'guest_annual');

            if (answers.fc === 'annual' && isGuestOk) {
                titleEl.textContent = '【Harmony 2】最速先行「FC年会員先行」の申込みが可能です！';
                detailEl.textContent = '最速先行が絶賛受付中です！受付期間：**2026年9月30日(水)22:00 ～ 10月13日(火)23:59**';
            } else if (answers.fc === 'annual' && answers.guest_fc !== 'guest_annual') {
                titleEl.textContent = '【Harmony 2 注意】最速先行は「同行者も年会員」が必須です';
                detailEl.textContent = '最速先行では、同行者様も「Ringo Jam 年会員」およびシリアルコード「Harmony CODE」を持っている必要があります。';
            } else if (answers.fc === 'monthly') {
                titleEl.textContent = '【Harmony 2】最速先行には「年会員コース」への変更が必要です';
                detailEl.textContent = '最速先行は年会員限定（10/13 23:59まで）です。月会員の方は期間内に年額コースへ切り替えることで申し込み可能です。';
            } else {
                titleEl.textContent = '【Harmony 2】オフィシャル先行・一般発売から申込可能';
                detailEl.textContent = '最速先行終了後、月会員向けやオフィシャル先行・一般発売の受付が順次スタートします。';
            }

            adviceEl.innerHTML = `
                <strong>【Harmony 2 最速先行の受付詳細】</strong><br>
                ・<strong>受付期間：</strong>2026年9月30日(水) 22:00 ～ 10月13日(火) 23:59 まで<br>

            `;
        }

        const items = [

        document.querySelectorAll('.step').forEach(el => {
